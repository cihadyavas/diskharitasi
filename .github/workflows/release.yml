name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    # Eski glibc (Debian 11, 2.31) üzerinde derle: yeni dağıtımların hepsinde çalışsın.
    container: debian:bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Araçlar
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates build-essential
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - name: Derle
        run: |
          . "$HOME/.cargo/env"
          cargo test --release
          cargo build --release
      - name: Paketle
        run: |
          V="${GITHUB_REF_NAME}"
          D="diskharitasi-${V}-linux-${{ matrix.arch }}"
          mkdir "$D"
          cp target/release/diskharitasi packaging/diskharitasi.desktop packaging/kur.sh assets/diskharitasi.svg README.md LICENSE "$D/"
          tar czf "$D.tar.gz" "$D"
          sha256sum "$D.tar.gz" > "$D.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: diskharitasi-*.tar.gz*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: diskharitasi-*
