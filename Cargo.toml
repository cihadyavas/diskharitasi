[package]
name = "diskharitasi"
version = "0.1.0"
edition = "2024"
description = "Treemap disk usage viewer for Linux"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
trash = "5"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
